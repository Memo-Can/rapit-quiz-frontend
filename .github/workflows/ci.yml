name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only
      - name: Playwright (e2e)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: "true"
